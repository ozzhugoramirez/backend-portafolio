<!-- =========================================================
     OVERLAY
========================================================= -->

<div
    class="chat-settings-overlay"
    id="chat-settings-overlay"
></div>


<!-- =========================================================
     PANEL SETTINGS
========================================================= -->

<aside
    class="chat-settings-panel"
    id="chat-settings-panel"
>


    <!-- HEADER -->

    <div class="settings-panel-header">

        <div>

            <h2>
                Configuración
            </h2>

            <p>
                Personalizá este chat.
            </p>

        </div>


        <button
            type="button"
            class="settings-close-button"
            id="close-chat-settings"
            aria-label="Cerrar configuración"
        >
            ×
        </button>

    </div>



    <!-- =====================================================
         MODO DE OLO
    ====================================================== -->

    <section class="settings-section">


        <div class="settings-section-header">

            <div>

                <h3>
                    Modo de Olo
                </h3>

                <p>
                    Elegí la personalidad para este chat.
                </p>

            </div>


            <a
                href="{% url 'olo_prompt_list' %}"
                target="_blank"
                class="manage-prompts-link"
            >
                Gestionar Prompts ↗
            </a>

        </div>



        <!-- =================================================
             PROMPTS
        ================================================== -->

        <div
            class="mode-grid"
            id="mode-selector"
        >


            {% for prompt in prompts %}


                <button
                    type="button"
                    class="mode-card {% if session.prompt and session.prompt.id == prompt.id %}active{% elif not session.prompt and forloop.first %}active{% endif %}"
                    data-prompt-id="{{ prompt.id }}"
                >


                    <span class="mode-icon">
                        ✦
                    </span>


                    <span class="mode-information">

                        <strong>
                            {{ prompt.name }}
                        </strong>

                    </span>


                </button>


            {% empty %}


                <p class="empty-prompts">
                    No tenés prompts creados.
                </p>


            {% endfor %}


        </div>


    </section>


</aside>
