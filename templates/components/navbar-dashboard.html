<nav class="olo-navbar">

    <!-- IZQUIERDA -->
    <div class="olo-navbar-left">

        <form
            method="POST"
            action="{% url 'logout' %}"
            class="olo-logout-form"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="olo-btn olo-btn-logout"
            >
                Cerrar sesión
            </button>
        </form>

    </div>


    <!-- CENTRO -->
    <div class="olo-navbar-center">
        <a
            href="{% url 'dashboard' %}"
            class="olo-nav-link
            {% if request.resolver_match.url_name == 'dashboard' %}
                active
            {% endif %}"
        >
            home
        </a>

        <a
            href="{% url 'information' %}"
            class="olo-nav-link
            {% if request.resolver_match.url_name == 'information' %}
                active
            {% endif %}"
        >
            Información
        </a>


        <a
            href="{% url 'projects' %}"
            class="olo-nav-link
            {% if request.resolver_match.url_name == 'projects' %}
                active
            {% endif %}"
        >
            Proyectos
        </a>


        <a
            href="{% url 'notes' %}"
            class="olo-nav-link
            {% if request.resolver_match.url_name == 'notes' %}
                active
            {% endif %}"
        >
            Notas
        </a>

    </div>


    <!-- DERECHA -->
    <div class="olo-navbar-right">

        <a
            href="{% url 'olo' %}"
            target="_blank"
            class="olo-btn olo-btn-open"
        >
            Open OLO
        </a>

    </div>

</nav>


<style>

    /* =========================
       NAVBAR
    ========================== */

    .olo-navbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 58px;

        display: grid;

        grid-template-columns:
            1fr
            auto
            1fr;

        align-items: center;

        padding: 0 20px;

        background:
            rgba(
                255,
                255,
                255,
                0.88
            );

        backdrop-filter:
            blur(18px);

        -webkit-backdrop-filter:
            blur(18px);

        border-bottom:
            1px solid
            rgba(
                0,
                0,
                0,
                0.06
            );

        z-index: 1000;

        transition:
            box-shadow 0.25s ease,
            background 0.25s ease;
    }


    .olo-navbar.scrolled {

        background:
            rgba(
                255,
                255,
                255,
                0.95
            );

        box-shadow:
            0 5px 20px
            rgba(
                0,
                0,
                0,
                0.05
            );

    }


    /* =========================
       IZQUIERDA
    ========================== */

    .olo-navbar-left {

        display: flex;

        justify-content:
            flex-start;

        align-items:
            center;

    }


    .olo-logout-form {

        margin: 0;

        padding: 0;

    }


    /* =========================
       CENTRO
    ========================== */

    .olo-navbar-center {

        display: flex;

        align-items:
            center;

        justify-content:
            center;

        gap: 6px;

        padding: 4px;

        background:
            rgba(
                0,
                0,
                0,
                0.035
            );

        border-radius:
            12px;

    }


    .olo-nav-link {

        position: relative;

        display: flex;

        align-items:
            center;

        justify-content:
            center;

        height: 36px;

        padding:
            0 16px;

        border-radius:
            9px;

        text-decoration:
            none;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        font-size:
            14px;

        font-weight:
            500;

        color:
            #737373;

        transition:
            color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.15s ease;

    }


    .olo-nav-link:hover {

        color:
            #111111;

        background:
            rgba(
                255,
                255,
                255,
                0.65
            );

    }


    .olo-nav-link:active {

        transform:
            scale(0.97);

    }


    /* TAB ACTIVO */

    .olo-nav-link.active {

        color:
            #111111;

        background:
            #ffffff;

        box-shadow:
            0 1px 4px
            rgba(
                0,
                0,
                0,
                0.08
            );

    }


    /* =========================
       DERECHA
    ========================== */

    .olo-navbar-right {

        display: flex;

        justify-content:
            flex-end;

        align-items:
            center;

    }


    /* =========================
       BOTONES
    ========================== */

    .olo-btn {

        height:
            36px;

        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        padding:
            0 16px;

        border-radius:
            999px;

        text-decoration:
            none;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        font-size:
            13px;

        font-weight:
            600;

        cursor:
            pointer;

        transition:
            transform 0.15s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;

    }


    .olo-btn:active {

        transform:
            scale(0.96);

    }


    /* =========================
       CERRAR SESIÓN
    ========================== */

    .olo-btn-logout {

        color:
            #d9363e;

        background:
            rgba(
                217,
                54,
                62,
                0.09
            );

        border:
            1px solid
            rgba(
                217,
                54,
                62,
                0.12
            );

        appearance:
            none;

        -webkit-appearance:
            none;

    }


    .olo-btn-logout:hover {

        background:
            rgba(
                217,
                54,
                62,
                0.14
            );

    }


    /* =========================
       OPEN OLO
    ========================== */

    .olo-btn-open {

        color:
            #ffffff;

        background:
            #111111;

        border:
            1px solid
            #111111;

    }


    .olo-btn-open:hover {

        background:
            #292929;

        box-shadow:
            0 5px 14px
            rgba(
                0,
                0,
                0,
                0.12
            );

    }


    /* =========================
       ESPACIO NAVBAR
    ========================== */

    body {

        padding-top:
            58px;

    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media
    (max-width: 720px) {

        .olo-navbar {

            padding:
                0 10px;

        }


        .olo-navbar-center {

            gap:
                2px;

        }


        .olo-nav-link {

            padding:
                0 9px;

            font-size:
                12px;

        }


        .olo-btn {

            padding:
                0 11px;

            font-size:
                12px;

        }

    }


    @media
    (max-width: 560px) {

        .olo-navbar {

            grid-template-columns:
                auto
                1fr
                auto;

            height:
                56px;

        }


        body {

            padding-top:
                56px;

        }


        .olo-navbar-center {

            background:
                transparent;

        }


        .olo-nav-link {

            padding:
                0 7px;

        }


        .olo-btn-logout {

            width:
                48px;

            padding:
                0;

            font-size:
                11px;

        }

    }

</style>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const navbar =
                document.querySelector(
                    ".olo-navbar"
                );


            /*
            =========================
            EFECTO AL HACER SCROLL
            =========================
            */

            function updateNavbar() {

                if (
                    window.scrollY > 10
                ) {

                    navbar.classList.add(
                        "scrolled"
                    );

                } else {

                    navbar.classList.remove(
                        "scrolled"
                    );

                }

            }


            window.addEventListener(
                "scroll",
                updateNavbar
            );


            updateNavbar();

        }
    );

</script>
