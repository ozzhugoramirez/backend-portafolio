{% extends "pages/OLO/base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 60px auto; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
    
    <a href="{% url 'olo_prompt_list' %}" style="color: #86868b; text-decoration: none; font-size: 14px; margin-bottom: 20px; display: inline-block;">← Volver</a>
    
    <h1 style="font-size: 32px; font-weight: 700; margin: 0 0 30px 0; letter-spacing: -0.04em;">
        {% if object %}Editar Prompt{% else %}Nuevo Prompt{% endif %}
    </h1>

    <form method="POST" style="background: white; border: 1px solid rgba(0,0,0,0.1); padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04);">
        {% csrf_token %}
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; font-size: 13px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Nombre del Modo</label>
            <input type="text" name="name" value="{{ object.name }}" required placeholder="Ej: Crítico de Código, Tutor de Inglés..." style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 16px; outline: none;">
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; font-size: 13px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Instrucciones del Sistema (System Prompt)</label>
            <textarea name="system_instruction" required placeholder="Escribí detalladamente cómo querés que se comporte Olo. Ej: Sos un experto en ciberseguridad, respondé de manera concisa..." style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 15px; outline: none; height: 200px; resize: vertical; line-height: 1.5;"></textarea>
            {% if object %}<script>document.getElementsByName('system_instruction')[0].value = "{{ object.system_instruction|escapejs }}";</script>{% endif %}
        </div>

        <button type="submit" style="width: 100%; background: #0071e3; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">
            Guardar Prompt
        </button>
    </form>
</div>
{% endblock content %}
